<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Штаб</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --accent: #e53935;
            --green: #4caf50;
            --gold: #ffb300;
            --gray: #777;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 30px; z-index: 1000;
        }
        #splash h2 { font-size: clamp(20px, 6vw, 28px); margin-bottom: 15px; text-transform: uppercase; color: var(--accent); }
        #splash p.main-text { font-size: clamp(14px, 4vw, 18px); margin-bottom: 20px; line-height: 1.4; max-width: 100%;}
        #splash p.pizdyulina { font-size: clamp(12px, 3.5vw, 15px); color: var(--gold); font-style: italic; margin-bottom: 40px; max-width: 100%; word-wrap: break-word;}
        #splash button { background-color: var(--accent); color: white; border: none; padding: 15px 40px; font-size: 16px; font-weight: bold; border-radius: 8px; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 20px; text-transform: uppercase; margin: 0; letter-spacing: 1px;}
        #streak-display { font-size: 14px; font-weight: bold; color: var(--gold); background: #2a2a2a; padding: 5px 10px; border-radius: 20px; }
        
        .progress-container { width: 100%; height: 6px; background: var(--card); border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
        #progress-bar { height: 100%; width: 0%; background: var(--green); transition: width 0.3s ease; }

        .tabs { display: flex; gap: 4px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 2px;}
        .tabs button { flex: 1; background-color: var(--card); color: var(--text); border: 1px solid #333; padding: 8px 4px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .tabs button.active { background-color: var(--accent); border-color: var(--accent); font-weight: bold; }

        .input-area { display: flex; gap: 10px; margin-bottom: 10px; }
        input[type="text"] { flex-grow: 1; padding: 12px; background-color: var(--card); border: 1px solid #333; border-radius: 8px; color: white; font-size: 16px; outline: none; }
        button.add-btn { padding: 12px 15px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; }
        
        .tags-container { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; }
        .tag-btn { background: transparent; border: 1px solid #555; color: #aaa; padding: 5px 10px; border-radius: 15px; font-size: 12px; }
        .tag-btn:disabled { opacity: 0.3; }
        
        #activeTagBadge { display: none; align-items: center; gap: 5px; background-color: rgba(76, 175, 80, 0.2); border: 1px solid var(--green); color: var(--green); padding: 2px 8px; border-radius: 12px; font-size: 12px; margin-bottom: 10px; width: fit-content; }
        #activeTagBadge span { cursor: pointer; font-weight: bold; }

        #content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 20px;}
        ul { list-style: none; padding: 0; margin: 0; }
        
        li { background-color: var(--card); padding: 12px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid var(--accent); display: flex; flex-direction: column; gap: 8px; position: relative; }
        li.done { border-left-color: var(--green); opacity: 0.5; }
        li.failed { border-left-color: var(--gray); }
        li.main-goal { border: 2px solid var(--gold); border-left: 6px solid var(--gold); box-shadow: 0 0 10px rgba(255, 179, 0, 0.2); }
        
        .task-row { display: flex; align-items: center; gap: 10px; }
        .checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #555; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
        li.done .checkbox { background-color: var(--green); border-color: var(--green); }
        .checkbox::after { content: '✓'; color: white; display: none; font-size: 14px; }
        li.done .checkbox::after { display: block; }
        
        .task-text { flex-grow: 1; font-size: 15px; word-break: break-word; }
        li.done .task-text { text-decoration: line-through; }
        
        .task-actions { display: flex; gap: 8px; }
        .action-btn { background: none; border: none; font-size: 18px; cursor: pointer; opacity: 0.7; }
        .action-btn.main-btn { color: var(--gold); }
        .action-btn.del-btn { color: var(--gray); }

        .big-goal-card { background: linear-gradient(145deg, #1e1e1e, #121212); border: 2px solid var(--gold); border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(255, 179, 0, 0.1); }
        .big-goal-title { font-size: 16px; font-weight: bold; color: var(--gold); margin-bottom: 5px; display: flex; justify-content: space-between;}
        .big-goal-deadline { font-size: 12px; color: #aaa; }
        .big-goal-step { background: #2a2a2a; padding: 10px; border-radius: 8px; margin-top: 10px; display: flex; align-items: center; gap: 10px;}
        .big-goal-msg { font-size: 12px; color: var(--accent); font-style: italic; margin-top: 5px; }

        #calendarView { display: none; flex-direction: column; }
        .month-block { margin-bottom: 20px; }
        .month-title { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 10px; color: var(--accent); text-transform: capitalize; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day-name { font-size: 11px; color: var(--gray); }
        .cal-day { padding: 8px 0; background-color: var(--card); border-radius: 6px; font-size: 14px; cursor: pointer; border: 1px solid transparent; position: relative; }
        .cal-day.empty { background: none; cursor: default; }
        .cal-day.today { border-color: var(--accent); font-weight: bold; }
        .dots-container { position: absolute; bottom: 2px; width: 100%; display: flex; justify-content: center; gap: 2px;}
        .dot { width: 4px; height: 4px; background-color: var(--gold); border-radius: 50%; }

        #dayView { display: none; flex-direction: column; height: 100%; }
        #dayViewHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        #dayViewTitle { font-size: 18px; font-weight: bold; color: var(--accent); }
        #backBtn { background: var(--card); color: white; border: none; padding: 8px 15px; border-radius: 6px; }

        #goalsView { display: none; flex-direction: column; }
        .goal-list-item { background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 4px solid var(--gold); display: flex; justify-content: space-between; align-items: center;}
        
        #createGoalForm { display: none; flex-direction: column; gap: 10px; background: var(--card); padding: 15px; border-radius: 8px; margin-bottom: 15px;}
        #createGoalForm input, #createGoalForm button { padding: 10px; border-radius: 6px; border: none; font-size: 14px;}
        #createGoalForm input { background: #333; color: white; }
        #createGoalForm button { background: var(--gold); color: black; font-weight: bold; }
    </style>
</head>
<body>

    <div id="splash">
        <h2>Это твой штаб.</h2>
        <p class="main-text">Здесь не ноют. Слабые сдаются — мы идем до конца.</p>
        <p class="pizdyulina" id="splashPhrase"></p>
        <button onclick="closeSplash()">ПРИСТУПИТЬ</button>
    </div>

    <div class="header">
        <h1>Мой Штаб</h1>
        <div id="streak-display">🔥 0 дней</div>
    </div>
    
    <div class="progress-container">
        <div id="progress-bar"></div>
    </div>

    <div class="tabs">
        <button id="tab-today" onclick="switchTab('today')">Сегодня</button>
        <button id="tab-tomorrow" onclick="switchTab('tomorrow')">Завтра</button>
        <button id="tab-goals" onclick="switchTab('goals')">Цели</button>
        <button id="tab-calendar" onclick="switchTab('calendar')">Календарь</button>
        <button id="tab-failed" onclick="switchTab('failed')">Проебал</button>
    </div>

    <div id="content">
        <div id="standardView" style="display: flex; flex-direction: column; height: 100%;">
            <div id="bigGoalContainer"></div>

            <div id="inputBlock">
                <div class="input-area">
                    <input type="text" id="taskInput" placeholder="Что нужно сделать?">
                    <button class="add-btn" onclick="addTask()">В БОЙ</button>
                </div>
                
                <div id="activeTagBadge">
                    <span id="activeTagText"></span>
                    <span onclick="removeTag()">✕</span>
                </div>

                <div class="tags-container" id="tagsContainer">
                    <button class="tag-btn" onclick="setTag('Спорт')">+ Спорт</button>
                    <button class="tag-btn" onclick="setTag('Работа')">+ Работа</button>
                    <button class="tag-btn" onclick="setTag('Блог')">+ Блог</button>
                    <button class="tag-btn" onclick="setTag('Дом')">+ Дом</button>
                </div>
            </div>
            <ul id="taskList"></ul>
        </div>

        <div id="goalsView">
            <button class="add-btn" style="margin-bottom: 15px; width: 100%;" onclick="toggleGoalForm()">+ НОВАЯ ЦЕЛЬ</button>
            
            <div id="createGoalForm">
                <input type="text" id="goalNameInput" placeholder="Название цели (напр. Купить тачку)">
                <input type="date" id="goalDateInput">
                <button onclick="createBigGoal()">СОЗДАТЬ</button>
            </div>

            <ul id="goalsList"></ul>
        </div>

        <div id="calendarView">
            <div id="calendarMonths"></div>
        </div>

        <div id="dayView">
            <div id="dayViewHeader">
                <button id="backBtn" onclick="closeDayView()">← Назад</button>
                <div id="dayViewTitle">Дата</div>
            </div>
            <div class="input-area">
                <input type="text" id="dayInput" placeholder="Задача на этот день...">
                <button class="add-btn" onclick="addTaskDayView()">В БОЙ</button>
            </div>
            <ul id="dayTaskList"></ul>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#121212'); }

        let tasks = JSON.parse(localStorage.getItem('my_tasks_v3')) || [];
        let goals = JSON.parse(localStorage.getItem('my_goals_v3')) || [];
        
        let currentTab = 'today';
        let activeDayDate = null;
        let streak = parseInt(localStorage.getItem('my_streak_v3')) || 0;
        let currentTag = null;

        const pizdyuliny = [
            "Пока ты спишь, кто-то ебашит.",
            "Дисциплина — это делать то, что не хочется.",
            "Твой единственный конкурент — это ты вчерашний.",
            "Сделал сегодня — свободен завтра.",
            "Слабые ищут оправдания, сильные ищут пути."
        ];

        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function getTomorrowStr() {
            const d = new Date(); d.setDate(d.getDate() + 1);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function daysBetween(date1, date2) {
            const d1 = new Date(date1); const d2 = new Date(date2);
            return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
        }

        function init() {
            processDayChange();
            checkSplash();
            updateStreakDisplay();
            switchTab('today');
        }

        function processDayChange() {
            const today = getTodayStr();
            const lastDate = localStorage.getItem('last_process_date');
            
            if (lastDate !== today) {
                let hasFailed = false;
                tasks = tasks.filter(t => {
                    if (t.done && t.date < today) return false;
                    if (!t.done && t.date < today && t.status !== 'failed') { t.status = 'failed'; hasFailed = true; }
                    return true;
                });
                
                const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 7);
                const weekAgoStr = weekAgo.getFullYear() + '-' + String(weekAgo.getMonth()+1).padStart(2,'0') + '-' + String(weekAgo.getDate()).padStart(2,'0');
                tasks = tasks.filter(t => t.date >= weekAgoStr);

                if (hasFailed) { streak = 0; }
                else if (lastDate !== null) { streak++; }
                else { streak = 1; }

                localStorage.setItem('my_streak_v3', streak);
                localStorage.setItem('last_process_date', today);
                saveData();
            }
        }

        function updateStreakDisplay() {
            document.getElementById('streak-display').innerText = `🔥 ${streak} дней`;
        }

        function checkSplash() {
            if (localStorage.getItem('last_visit') !== getTodayStr()) {
                document.getElementById('splashPhrase').innerText = `"${pizdyuliny[Math.floor(Math.random() * pizdyuliny.length)]}"`;
                document.getElementById('splash').style.display = 'flex';
            }
        }
        function closeSplash() {
            localStorage.setItem('last_visit', getTodayStr());
            document.getElementById('splash').style.display = 'none';
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            
            document.getElementById('standardView').style.display = 'none';
            document.getElementById('calendarView').style.display = 'none';
            document.getElementById('goalsView').style.display = 'none';
            document.getElementById('dayView').style.display = 'none';

            if (tab === 'calendar') {
                document.getElementById('calendarView').style.display = 'flex';
                renderCalendar();
            } else if (tab === 'goals') {
                document.getElementById('goalsView').style.display = 'flex';
                renderGoals();
            } else {
                document.getElementById('standardView').style.display = 'flex';
                document.getElementById('inputBlock').style.display = (tab === 'failed') ? 'none' : 'block';
                renderTasks();
                renderBigGoalToday();
            }
            removeTag(); 
        }

        function setTag(tagText) {
            currentTag = tagText;
            document.getElementById('activeTagText').innerText = tagText;
            document.getElementById('activeTagBadge').style.display = 'flex';
            document.getElementById('tagsContainer').style.display = 'none';
        }
        function removeTag() {
            currentTag = null;
            document.getElementById('activeTagBadge').style.display = 'none';
            document.getElementById('tagsContainer').style.display = 'flex';
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            let text = input.value.trim();
            if (!text) return;

            if (currentTag) text = `[${currentTag}] ${text}`;

            let taskDate = getTodayStr();
            if (currentTab === 'tomorrow') taskDate = getTomorrowStr();

            tasks.push({ id: Date.now(), text: text, date: taskDate, done: false, status: 'active', isMainGoal: false });
            input.value = '';
            removeTag();
            saveData();
            renderTasks();
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) { task.done = !task.done; saveData(); renderTasks(); if(tg) tg.HapticFeedback.notificationOccurred('success'); }
        }
        function deleteTask(id) { tasks = tasks.filter(t => t.id !== id); saveData(); renderTasks(); }
        function setMainGoal(id) {
            const task = tasks.find(t => t.id === id);
            if (task) { tasks.forEach(t => { if(t.date === task.date) t.isMainGoal = false; }); task.isMainGoal = true; saveData(); renderTasks(); }
        }
        function rescheduleTask(id) {
            const select = document.getElementById(`resched-${id}`);
            const task = tasks.find(t => t.id === id);
            if (task && select.value) { task.date = select.value; task.status = 'active'; task.done = false; saveData(); renderTasks(); }
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const today = getTodayStr();
            list.innerHTML = '';

            let filtered = tasks.filter(t => {
                if (currentTab === 'today') return t.date === today && t.status !== 'failed';
                if (currentTab === 'tomorrow') return t.date === getTomorrowStr() && t.status !== 'failed';
                if (currentTab === 'failed') return t.status === 'failed';
                return false;
            });
            filtered.sort((a, b) => (b.isMainGoal === true ? 1 : 0) - (a.isMainGoal === true ? 1 : 0));
            
            if (currentTab === 'today' && filtered.length > 0) {
                const doneCount = filtered.filter(t => t.done).length;
                const percent = Math.round((doneCount / filtered.length) * 100);
                document.getElementById('progress-bar').style.width = percent + '%';
                document.getElementById('progress-bar').style.background = percent === 100 ? 'var(--gold)' : 'var(--green)';
            } else {
                document.getElementById('progress-bar').style.width = '0%';
            }

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#777; margin-top:20px;">Здесь пусто.</div>';
                return;
            }

            filtered.forEach(task => {
                const li = document.createElement('li');
                let classes = '';
                if (task.done) classes += 'done ';
                if (task.status === 'failed') classes += 'failed ';
                if (task.isMainGoal && !task.done) classes += 'main-goal ';
                li.className = classes;

                let reschedHTML = '';
                if (task.status === 'failed') {
                    reschedHTML = `
                        <div class="reschedule-area" style="display:flex;">
                            <select id="resched-${task.id}">
                                <option value="${today}">Сегодня</option>
                                <option value="${getTomorrowStr()}">Завтра</option>
                            </select>
                            <button onclick="rescheduleTask(${task.id})">Перенести</button>
                        </div>
                    `;
                }

                li.innerHTML = `
                    <div class="task-row">
                        <div class="checkbox" onclick="toggleTask(${task.id})"></div>
                        <span class="task-text">${task.text}</span>
                        <div class="task-actions">
                            ${!task.done && task.status !== 'failed' ? `<button class="action-btn main-btn" onclick="setMainGoal(${task.id})">${task.isMainGoal ? '⭐' : '☆'}</button>` : ''}
                            <button class="action-btn del-btn" onclick="deleteTask(${task.id})">✕</button>
                        </div>
                    </div>
                    ${task.status === 'failed' ? `<div class="task-date">Проебал: ${task.date}</div>` : ''}
                    ${reschedHTML}
                `;
                list.appendChild(li);
            });
        }

        function toggleGoalForm() {
            const form = document.getElementById('createGoalForm');
            form.style.display = form.style.display === 'flex' ? 'none' : 'flex';
        }

        function createBigGoal() {
            const name = document.getElementById('goalNameInput').value.trim();
            const date = document.getElementById('goalDateInput').value;
            if (!name || !date) return;

            goals.push({ id: Date.now(), name: name, deadline: date, steps: [] });
            document.getElementById('goalNameInput').value = '';
            document.getElementById('goalDateInput').value = '';
            toggleGoalForm();
            saveData();
            renderGoals();
            if(tg) tg.HapticFeedback.notificationOccurred('success');
        }

        function renderGoals() {
            const list = document.getElementById('goalsList');
            list.innerHTML = '';
            
            if (goals.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#777;">У тебя нет больших целей. Придумай что-то глобальное.</div>';
                return;
            }

            goals.forEach(goal => {
                const li = document.createElement('li');
                li.className = 'goal-list-item';
                const daysLeft = daysBetween(getTodayStr(), goal.deadline);
                
                li.innerHTML = `
                    <div onclick="openGoal(${goal.id})" style="flex-grow:1;">
                        <div style="color:var(--gold); font-weight:bold; font-size:16px;">🎯 ${goal.name}</div>
                        <div style="font-size:12px; color:#aaa; margin-top:5px;">До дедлайна: ${daysLeft} дн.</div>
                    </div>
                    <button class="action-btn del-btn" onclick="deleteGoal(${goal.id})">✕</button>
                `;
                list.appendChild(li);
            });
        }

        function deleteGoal(id) {
            goals = goals.filter(g => g.id !== id);
            saveData();
            renderGoals();
        }

        function renderBigGoalToday() {
            const container = document.getElementById('bigGoalContainer');
            container.innerHTML = '';
            
            if (currentTab !== 'today') return;
            if (goals.length === 0) return;

            const goal = goals[0]; // Берем первую цель
            const daysLeft = daysBetween(getTodayStr(), goal.deadline);
            let currentStep = goal.steps.find(s => !s.done);

            let msg = "";
            if (daysLeft > 30) msg = "Время есть, но не расслабляйся.";
            else if (daysLeft > 7) msg = "Дедлайн близко. Ускоряйся.";
            else if (daysLeft >= 0) msg = "Пиздец как мало времени. Ебашь!";
            else msg = "Дедлайн проехан. Ты либо сделал, либо проебал.";

            let html = `
                <div class="big-goal-card">
                    <div class="big-goal-title">
                        <span>🎯 ${goal.name}</span>
                        <span class="big-goal-deadline">${daysLeft} дн.</span>
                    </div>
                    <div class="big-goal-msg">${msg}</div>
            `;

            if (currentStep) {
                html += `
                    <div class="big-goal-step">
                        <div class="checkbox" onclick="toggleGoalStep(${goal.id}, ${currentStep.id})"></div>
                        <span style="flex-grow:1; font-size:14px;">Шаг: ${currentStep.text}</span>
                    </div>
                `;
            } else {
                html += `<div style="font-size:12px; color:var(--green); margin-top:10px;">Все шаги выполнены. Осталось дождаться дедлайна.</div>`;
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function openGoal(id) {
            const goal = goals.find(g => g.id === id);
            if (!goal) return;
            const action = prompt("Введи НОВЫЙ ШАГ для цели '" + goal.name + "':");
            if (action && action.trim() !== '') {
                goal.steps.push({ id: Date.now(), text: action.trim(), done: false });
                saveData();
                renderBigGoalToday();
            }
        }

        function toggleGoalStep(goalId, stepId) {
            const goal = goals.find(g => g.id === goalId);
            if (!goal) return;
            const step = goal.steps.find(s => s.id === stepId);
            if (step) {
                step.done = !step.done;
                saveData();
                renderBigGoalToday();
                if(tg) tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function renderCalendar() {
            const container = document.getElementById('calendarMonths');
            container.innerHTML = '';
            const today = getTodayStr();
            const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            const now = new Date();
            
            for (let i = 0; i < 3; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
                const month = d.getMonth(); const year = d.getFullYear();
                const monthBlock = document.createElement('div');
                monthBlock.className = 'month-block';
                let html = `<div class="month-title">${months[month]} ${year}</div><div class="calendar-grid">`;
                daysOfWeek.forEach(day => html += `<div class="day-name">${day}</div>`);
                let firstDay = d.getDay(); if (firstDay === 0) firstDay = 7;
                for (let j = 1; j < firstDay; j++) html += `<div class="cal-day empty"></div>`;
                const totalDays = new Date(year, month + 1, 0).getDate();
                for (let day = 1; day <= totalDays; day++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                    const tasksOnDay = tasks.filter(t => t.date === dateStr && t.status !== 'failed');
                    let dotsHTML = '';
                    if (tasksOnDay.length > 0) {
                        dotsHTML = '<div class="dots-container">';
                        for(let k=0; k < Math.min(tasksOnDay.length, 4); k++) dotsHTML += '<div class="dot"></div>';
                        dotsHTML += '</div>';
                    }
                    let classNames = 'cal-day'; if (dateStr === today) classNames += ' today';
                    html += `<div class="${classNames}" onclick="openDayView('${dateStr}')">${day}${dotsHTML}</div>`;
                }
                html += `</div>`; monthBlock.innerHTML = html; container.appendChild(monthBlock);
            }
        }

        function openDayView(dateStr) {
            activeDayDate = dateStr;
            document.getElementById('calendarView').style.display = 'none';
            document.getElementById('dayView').style.display = 'flex';
            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1]-1, parts[2]);
            const months = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
            document.getElementById('dayViewTitle').innerText = `${d.getDate()} ${months[d.getMonth()]}`;
            renderDayViewTasks();
        }
        function closeDayView() { activeDayDate = null; document.getElementById('dayView').style.display = 'none'; document.getElementById('calendarView').style.display = 'flex'; renderCalendar(); }

        function renderDayViewTasks() {
            const list = document.getElementById('dayTaskList'); list.innerHTML = '';
            const filtered = tasks.filter(t => t.date === activeDayDate && t.status !== 'failed');
            if (filtered.length === 0) { list.innerHTML = '<div style="text-align:center; color:#777; margin-top:20px;">На этот день пусто.</div>'; return; }
            filtered.forEach(task => {
                const li = document.createElement('li');
                if (task.done) li.className = 'done';
                li.innerHTML = `
                    <div class="task-row">
                        <div class="checkbox" onclick="toggleTaskFromDay(${task.id})"></div>
                        <span class="task-text">${task.text}</span>
                        <button class="action-btn del-btn" onclick="deleteTaskFromDay(${task.id})">✕</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function addTaskDayView() {
            const input = document.getElementById('dayInput');
            const text = input.value.trim();
            if (!text) return;
            tasks.push({ id: Date.now(), text: text, date: activeDayDate, done: false, status: 'active', isMainGoal: false });
            input.value = '';
            saveData();
            renderDayViewTasks();
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function toggleTaskFromDay(id) { toggleTask(id); renderDayViewTasks(); }
        function deleteTaskFromDay(id) { deleteTask(id); renderDayViewTasks(); }

        function saveData() {
            localStorage.setItem('my_tasks_v3', JSON.stringify(tasks));
            localStorage.setItem('my_goals_v3', JSON.stringify(goals));
        }

        init();
    </script>
</body>
</html>
