<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой путь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #8e8e93);
            --link: var(--tg-theme-link-color, #2481cc);
            --button: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --separator: color-mix(in srgb, var(--tg-theme-hint-color, #8e8e93) 25%, transparent);

            /* Акценты статусов */
            --green: #34c759;
            --gold: #ff9f0a;
            --red: #ff3b30;

            /* Нео-брутализм: контур и жёсткие тени цвета текста темы */
            --ink: var(--text);
            --bw: 2px;
            --hard: 4px 4px 0 var(--ink);
            --hard-sm: 2px 2px 0 var(--ink);
            --flat: 0 0 0 var(--ink);
            --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, "Courier New", monospace;

            --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
            --dur: 0.18s;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body {
            background-color: var(--bg);
            background-image: radial-gradient(color-mix(in srgb, var(--text) 16%, transparent) 1px, transparent 1px);
            background-size: 16px 16px;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.4;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
        }
        button { font-family: inherit; }

        /* ШАПКА */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px 16px 14px;
        }
        h1 {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--mono);
            font-size: 22px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.1;
            text-transform: uppercase;
        }
        h1::before {
            content: ""; width: 14px; height: 14px; flex-shrink: 0;
            background: var(--button);
            border: var(--bw) solid var(--ink);
            box-shadow: var(--hard-sm);
        }
        #streak-display {
            font-family: var(--mono);
            font-size: 15px; font-weight: 800; color: #000;
            background: var(--gold);
            padding: 6px 12px;
            border: var(--bw) solid var(--ink);
            box-shadow: var(--hard-sm);
            font-variant-numeric: tabular-nums;
        }

        /* ВКЛАДКИ */
        .tabs {
            display: flex; gap: 10px; overflow-x: auto;
            padding: 6px 16px 12px;
            border-bottom: var(--bw) solid var(--ink);
            scrollbar-width: none; flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tabs button {
            flex: 0 0 auto;
            background-color: var(--bg); color: var(--ink);
            border: var(--bw) solid var(--ink); border-radius: 0;
            padding: 9px 14px;
            font-family: var(--mono); font-size: 12px; font-weight: 700;
            letter-spacing: 0.6px; text-transform: uppercase;
            cursor: pointer; white-space: nowrap;
            box-shadow: var(--hard-sm);
            transition: transform var(--dur) var(--ease),
                        box-shadow var(--dur) var(--ease),
                        background-color var(--dur) ease,
                        color var(--dur) ease;
        }
        .tabs button:active { transform: translate(2px, 2px); box-shadow: var(--flat); }
        .tabs button.active {
            background-color: var(--ink); color: var(--bg);
            transform: translate(2px, 2px);
            box-shadow: var(--flat);
        }

        /* КОНТЕНТ */
        #content {
            flex-grow: 1; overflow-y: auto; padding: 18px 16px calc(100px + var(--safe-bottom));
            display: flex; flex-direction: column; min-height: 0;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            scrollbar-width: none;
        }
        #content::-webkit-scrollbar { display: none; }
        #content:has(#chatView[style*="display: flex"]) {
            padding-bottom: calc(16px + var(--safe-bottom));
        }

        /* СМЕНА ВКЛАДОК */
        #standardView, #chatView, #calendarView, #hallView {
            animation: viewIn 0.28s var(--ease) backwards;
        }
        @keyframes viewIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ПОЛЯ ВВОДА */
        .input-area, .chat-input-area {
            display: flex; gap: 10px; margin-bottom: 12px;
            background: var(--bg);
            border: var(--bw) solid var(--ink); border-radius: 0;
            padding: 4px 4px 4px 14px; align-items: center;
            box-shadow: var(--hard);
            transition: box-shadow var(--dur) var(--ease), transform var(--dur) var(--ease);
        }
        .chat-input-area { margin-bottom: 0; margin-top: 6px; }
        .input-area:focus-within, .chat-input-area:focus-within {
            box-shadow: 6px 6px 0 var(--button);
            transform: translate(-2px, -2px);
        }
        input[type="text"] {
            flex-grow: 1; min-width: 0; background: transparent; border: none;
            color: var(--text); font-size: 16px; font-weight: 500; line-height: 1.4; outline: none;
            font-family: inherit; padding: 10px 0;
            caret-color: var(--button);
        }
        input[type="text"]::placeholder { color: var(--hint); font-weight: 400; transition: opacity 0.2s ease; }
        input[type="text"]:focus::placeholder { opacity: 0.5; }
        .chat-input-area input { background: transparent; padding: 10px 0; border: none; flex-grow: 1; color: var(--text); font-size: 16px; }

        button.add-btn {
            background: var(--button); color: var(--button-text);
            border: var(--bw) solid var(--ink); border-radius: 0;
            width: 42px; height: 42px; min-width: 42px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; padding-left: 2px;
            box-shadow: var(--hard-sm);
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        }
        button.add-btn:active { transform: translate(2px, 2px); box-shadow: var(--flat); }

        /* ТЕГИ */
        .tags-container { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .tag-btn {
            background: var(--bg); color: var(--ink);
            border: var(--bw) solid var(--ink); border-radius: 0;
            padding: 7px 12px;
            font-family: var(--mono); font-size: 12px; font-weight: 700;
            letter-spacing: 0.5px; text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--hard-sm);
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) ease, color var(--dur) ease;
        }
        .tag-btn:active { transform: translate(2px, 2px); box-shadow: var(--flat); }
        .tag-btn.active {
            background: var(--ink); color: var(--bg);
            transform: translate(2px, 2px);
            box-shadow: var(--flat);
        }

        /* КАРТОЧКИ ЗАДАЧ */
        ul { list-style: none; }
        li {
            background-color: var(--bg);
            padding: 13px 10px 13px 12px; margin-bottom: 14px;
            border: var(--bw) solid var(--ink); border-radius: 0;
            display: flex; align-items: center; gap: 12px;
            box-shadow: var(--hard);
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) ease;
        }
        #taskList li:active { transform: translate(2px, 2px); box-shadow: var(--hard-sm); }
        li.done { background-color: var(--card); box-shadow: var(--flat); }
        .task-text {
            flex-grow: 1; font-size: 16px; font-weight: 600; line-height: 1.35; letter-spacing: -0.1px;
            word-break: break-word;
            transition: color 0.3s ease;
        }
        li.done .task-text { text-decoration: line-through; color: var(--hint); font-weight: 500; }

        #taskList > div {
            margin-top: 24px !important;
            padding: 28px 20px;
            border: var(--bw) dashed var(--hint);
            font-family: var(--mono);
            font-size: 13px !important; font-weight: 600;
            letter-spacing: 0.4px; text-transform: uppercase;
            line-height: 1.5;
        }

        .icon-btn {
            background: none; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 7px; border-radius: 0;
            transition: transform var(--dur) var(--ease), background-color var(--dur) ease, box-shadow var(--dur) var(--ease), border-color var(--dur) ease;
        }
        .icon-btn:active { transform: scale(0.88); background: var(--separator); }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--ink); transition: fill var(--dur) ease, opacity var(--dur) ease; }
        .icon-btn.check svg { fill: #000; }

        /* Чекбокс слева */
        li > .icon-btn:first-child {
            width: 30px; height: 30px; min-width: 30px; padding: 0;
            border: var(--bw) solid var(--ink);
            background: var(--bg);
            box-shadow: var(--hard-sm);
        }
        li > .icon-btn:first-child svg { width: 18px; height: 18px; opacity: 0; }
        li > .icon-btn:first-child:active { transform: translate(2px, 2px); box-shadow: var(--flat); background: var(--card); }
        li > .icon-btn:first-child.check {
            background: var(--green);
            transform: translate(2px, 2px);
            box-shadow: var(--flat);
        }
        li > .icon-btn:first-child.check svg { opacity: 1; fill: #000; }
        li > .icon-btn:first-child.check:active { background: var(--green); transform: translate(2px, 2px); }

        /* Удаление справа */
        li > .icon-btn:last-child {
            width: 34px; height: 34px; min-width: 34px; padding: 0;
            border: var(--bw) solid transparent;
        }
        li > .icon-btn:last-child svg { opacity: 0.55; }
        li > .icon-btn:last-child:active { background: var(--red); border-color: var(--ink); transform: none; }
        li > .icon-btn:last-child:active svg { fill: #000; opacity: 1; }

        /* ЧАТ */
        #chatView { display: none; flex-direction: column; height: 100%; min-height: 0; }
        .chat-messages {
            flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column;
            gap: 14px; padding: 4px 6px 16px 2px; min-height: 0;
            scrollbar-width: none;
        }
        .chat-messages::-webkit-scrollbar { display: none; }
        .msg-bubble {
            padding: 10px 14px; max-width: 84%;
            border: var(--bw) solid var(--ink); border-radius: 0;
            box-shadow: 3px 3px 0 var(--ink);
            font-size: 16px; font-weight: 500; line-height: 1.4;
            word-break: break-word; white-space: pre-wrap;
            animation: bubbleIn 0.22s var(--ease) backwards;
        }
        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-user { background: var(--button); color: var(--button-text); align-self: flex-end; }
        .msg-ai { background: var(--bg); color: var(--text); align-self: flex-start; border-left: 6px solid var(--gold); }

        /* ЭКРАН ПРИВЕТСТВИЯ */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg);
            background-image: radial-gradient(color-mix(in srgb, var(--text) 16%, transparent) 1px, transparent 1px);
            background-size: 16px 16px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 48px 24px; z-index: 1000;
            animation: splashIn 0.35s ease backwards;
        }
        #splash::before, #splash::after {
            content: ""; position: absolute; left: 0; right: 0; height: 22px;
            background: repeating-linear-gradient(-45deg, var(--gold) 0 14px, var(--ink) 14px 28px);
        }
        #splash::before { top: 0; border-bottom: 3px solid var(--ink); }
        #splash::after { bottom: 0; border-top: 3px solid var(--ink); }
        @keyframes splashIn { from { opacity: 0; } to { opacity: 1; } }
        #splash h2 {
            display: inline-block;
            font-family: var(--mono);
            font-size: clamp(30px, 11vw, 44px); font-weight: 800; line-height: 1.05; letter-spacing: -1px;
            text-transform: uppercase;
            color: #000; background: var(--gold);
            padding: 8px 16px; margin-bottom: 32px;
            border: 3px solid var(--ink);
            box-shadow: 6px 6px 0 var(--ink);
            transform: rotate(-2deg);
        }
        #splash .main-desc { font-size: 18px; font-weight: 700; color: var(--ink); margin-bottom: 28px; line-height: 1.6; }
        #splash .main-desc::first-line {
            font-family: var(--mono); font-size: 20px; font-weight: 800; color: var(--button);
            text-transform: uppercase;
        }
        #splash .phrase { font-size: 15px; color: var(--gold); font-style: italic; margin-bottom: 36px; min-height: 20px; line-height: 1.5; }
        #splash button {
            background-color: var(--button); color: var(--button-text);
            border: 3px solid var(--ink); border-radius: 0;
            padding: 16px 40px;
            font-family: var(--mono); font-size: 17px; font-weight: 800; letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 6px 6px 0 var(--ink);
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        }
        #splash button:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 var(--ink); }

        /* ПЛАВАЮЩАЯ КНОПКА */
        .fab-btn {
            position: fixed; bottom: calc(20px + var(--safe-bottom)); right: 20px;
            width: 60px; height: 60px; border-radius: 0;
            background: var(--button); color: var(--button-text);
            font-family: var(--mono); font-size: 34px; font-weight: 700; line-height: 1;
            border: 3px solid var(--ink);
            box-shadow: 5px 5px 0 var(--ink);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100;
            animation: fabIn 0.28s var(--ease) backwards;
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        }
        @keyframes fabIn {
            from { opacity: 0; transform: scale(0.6) rotate(-12deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }
        .fab-btn:active { transform: translate(4px, 4px); box-shadow: 1px 1px 0 var(--ink); }

        /* ПАНЕЛЬ ДОБАВЛЕНИЯ */
        .add-panel-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
            z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        .add-panel-overlay.active { opacity: 1; pointer-events: auto; }
        .add-panel {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: var(--bg);
            border-top: 3px solid var(--ink); border-radius: 0;
            padding: 0 16px calc(22px + var(--safe-bottom));
            transform: translateY(100%);
            transition: transform 0.35s var(--ease);
        }
        .add-panel::before {
            content: ""; display: block; height: 14px; margin: 0 -16px 18px;
            background: repeating-linear-gradient(-45deg, var(--gold) 0 10px, var(--ink) 10px 20px);
            border-bottom: 3px solid var(--ink);
        }
        .add-panel-overlay.active .add-panel { transform: translateY(0); }
        .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .panel-title {
            font-family: var(--mono); font-weight: 800; font-size: 16px;
            letter-spacing: 0.6px; text-transform: uppercase;
        }
        .panel-close {
            background: var(--bg); border: var(--bw) solid var(--ink); border-radius: 0; color: var(--ink); cursor: pointer;
            width: 34px; height: 34px; font-size: 14px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--hard-sm);
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        }
        .panel-close:active { transform: translate(2px, 2px); box-shadow: var(--flat); }

        /* КАЛЕНДАРЬ */
        #calendarView .month-block {
            background: var(--bg);
            border: var(--bw) solid var(--ink); border-radius: 0;
            padding: 16px; box-shadow: var(--hard);
        }
        .month-title {
            margin: -16px -16px 18px !important;
            padding: 12px !important;
            background: var(--ink);
            color: var(--bg) !important;
            font-family: var(--mono);
            font-size: 15px !important; font-weight: 800 !important;
            letter-spacing: 1.5px; text-transform: uppercase;
        }
        .calendar-grid { gap: 8px 6px !important; }
        .calendar-grid > div:not(.cal-day) {
            font-family: var(--mono);
            font-weight: 800; letter-spacing: 0.4px; text-transform: uppercase;
            color: var(--ink) !important;
        }
        .cal-day {
            background: var(--bg) !important;
            color: var(--ink);
            border: var(--bw) solid var(--ink);
            border-radius: 0 !important;
            padding: 11px 0 !important;
            font-family: var(--mono);
            font-size: 14px !important; font-weight: 700;
            font-variant-numeric: tabular-nums;
            box-shadow: var(--hard-sm);
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), background-color var(--dur) ease;
        }
        .cal-day:active { transform: translate(2px, 2px); box-shadow: var(--flat); background: var(--gold) !important; }
        .cal-day.past {
            opacity: 0.35; pointer-events: none; box-shadow: none;
            background: var(--card) !important;
            border-style: dashed; border-color: var(--hint);
        }

        /* ЗАЛ СЛАВЫ */
        .hall-title {
            display: block;
            font-family: var(--mono);
            font-size: 14px;
            font-weight: 800 !important;
            letter-spacing: 0.8px; text-transform: uppercase;
            padding: 10px 14px;
            margin-bottom: 16px !important;
            background: var(--bg);
            border: var(--bw) solid currentColor;
            box-shadow: 3px 3px 0 currentColor;
        }
        .hall-section li {
            background: var(--bg) !important;
            border: var(--bw) solid var(--ink) !important;
            border-radius: 0 !important;
            padding: 12px 14px !important;
            margin-bottom: 12px !important;
            box-shadow: var(--hard-sm);
            font-size: 15px; font-weight: 600; line-height: 1.4;
        }
        #hallDoneList li { border-left: 8px solid var(--green) !important; }
        #hallFailList li { border-left: 8px solid var(--red) !important; }
        #hallDoneList > div, #hallFailList > div {
            padding: 14px;
            border: var(--bw) dashed currentColor;
            font-family: var(--mono);
            font-size: 13px !important; font-weight: 600;
            line-height: 1.5;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН ПРИВЕТСТВИЯ -->
    <div id="splash">
        <h2>МОЙ ПУТЬ</h2>
        <p class="main-desc">Это твой штаб.<br>Здесь не ноют.<br>Слабые сдаются — мы идем до конца.</p>
        <p class="phrase" id="splashPhrase"></p>
        <button onclick="closeSplash()">ПРИСТУПИТЬ</button>
    </div>

    <!-- ШАПКА -->
    <div class="header">
        <h1>Мой путь</h1>
        <div id="streak-display">🔥 0</div>
    </div>

    <!-- ВКЛАДКИ -->
    <div class="tabs" id="tabsContainer">
        <button id="tab-today" onclick="switchTab('today')">Сегодня</button>
        <button id="tab-tomorrow" onclick="switchTab('tomorrow')">Завтра</button>
        <button id="tab-calendar" onclick="switchTab('calendar')">Календарь</button>
        <button id="tab-hall" onclick="switchTab('hall')">Зал славы</button>
        <button id="tab-chat" onclick="switchTab('chat')">Мотиватор</button>
    </div>

    <!-- КОНТЕНТ -->
    <div id="content">
        <!-- ВКЛАДКА СЕГОДНЯ/ЗАВТРА -->
        <div id="standardView" style="display: flex; flex-direction: column; height: 100%;">
            
            <ul id="taskList"></ul>
        </div>

        <!-- ЧАТ -->
        <div id="chatView">
            <div class="chat-messages" id="chatMessages">
                <div class="msg-bubble msg-ai">Я твой мотиватор. Выкладывай, что случилось, и мы это разъебем.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Напиши сообщение..." onkeypress="handleChatKeyPress(event)">
                <button class="add-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

               <!-- КАЛЕНДАРЬ -->
        <div id="calendarView" style="display: none; flex-direction: column;">
            <div id="calendarMonths"></div>
        </div>

        <!-- ЗАЛ СЛАВЫ -->
        <div id="hallView" style="display: none; flex-direction: column;">
            <div class="hall-section">
                <div class="hall-title done-title" style="color: var(--green); font-weight: bold; margin-bottom: 10px;">✅ Выполнено</div>
                <ul id="hallDoneList"></ul>
            </div>
            <div class="hall-section" style="margin-top: 20px;">
                <div class="hall-title fail-title" style="color: var(--red); font-weight: bold; margin-bottom: 10px;">❌ Не выполнено</div>
                <ul id="hallFailList"></ul>
            </div>
        </div>
    </div>

    <!-- ПАНЕЛЬ ДОБАВЛЕНИЯ (Плавающая кнопка) -->
    <button class="fab-btn" id="fabBtn" onclick="openAddPanel()">+</button>
    <div class="add-panel-overlay" id="addPanelOverlay" onclick="closeAddPanel(event)">
        <div class="add-panel" onclick="event.stopPropagation()">
            <div class="panel-head">
                <span class="panel-title">Новая задача</span>
                <button class="panel-close" onclick="closeAddPanel()">✕</button>
            </div>
            <div class="input-area" style="margin-bottom:12px;">
                <input type="text" id="panelTaskInput" placeholder="Что нужно сделать?">
                <button class="add-btn" onclick="addTask('panel')">➤</button>
            </div>
            <div class="tags-container" style="margin-bottom:0;">
                <button class="tag-btn" onclick="selectTag('Спорт', this)">Спорт</button>
                <button class="tag-btn" onclick="selectTag('Работа', this)">Работа</button>
                <button class="tag-btn" onclick="selectTag('Блог', this)">Блог</button>
                <button class="tag-btn" onclick="selectTag('Личное', this)">Личное</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor("secondary_bg_color"); tg.setBackgroundColor("bg_color"); }

        let tasks = JSON.parse(localStorage.getItem('my_path_tasks')) || [];
        let currentTab = 'today';
        let selectedTag = null;

        // Инициализация
        function init() {
            const lastVisit = localStorage.getItem('last_visit');
            const today = new Date().toDateString();
            if (lastVisit !== today) {
                document.getElementById('splash').style.display = 'flex';
                localStorage.setItem('last_visit', today);
            } else {
                document.getElementById('splash').style.display = 'none';
            }
            
            document.getElementById('tab-today').classList.add('active');
            renderTasks();
            updateStreak();
        }

        function closeSplash() {
            document.getElementById('splash').style.display = 'none';
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        // Переключение вкладок
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');

            document.getElementById('standardView').style.display = 'none';
            document.getElementById('calendarView').style.display = 'none';
            document.getElementById('chatView').style.display = 'none';
            document.getElementById('hallView').style.display = 'none';
            
            document.getElementById('fabBtn').style.display = (tab === 'today' || tab === 'tomorrow') ? 'flex' : 'none';

                        if (tab === 'calendar') {
                document.getElementById('calendarView').style.display = 'flex';
                renderCalendar();
            } else if (tab === 'hall') {
                document.getElementById('hallView').style.display = 'flex';
                renderHall();
            } else if (tab === 'chat') {
                document.getElementById('chatView').style.display = 'flex';
                scrollToBottom();
            } else {
                document.getElementById('standardView').style.display = 'flex';
                renderTasks();
            }
        }

        // Добавление задачи
        function addTask(source) {
            const inputId = source === 'panel' ? 'panelTaskInput' : 'taskInput';
            const input = document.getElementById(inputId);
            
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            let dateToSave = new Date();
            if (currentTab === 'tomorrow') dateToSave.setDate(dateToSave.getDate() + 1);
            
            tasks.push({ 
                id: Date.now(), 
                text: text, 
                date: dateToSave.toISOString().split('T')[0], 
                done: false, 
                tag: selectedTag 
            });
            
            saveData();
            input.value = '';
            selectedTag = null;
            document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            
            if (source === 'panel') {
                document.getElementById('addPanelOverlay').classList.remove('active');
            }
            
            renderTasks();
            if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                saveData();
                renderTasks();
                if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveData();
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            if (!list) return;
            list.innerHTML = '';
            
            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
            const targetDate = currentTab === 'tomorrow' ? tomorrow : today;

            const filtered = tasks.filter(t => t.date === targetDate);

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:var(--hint); margin-top:20px; font-size:14px;">Здесь пусто. Добавь задачу.</div>';
                return;
            }

            filtered.forEach(task => {
                const li = document.createElement('li');
                if (task.done) li.classList.add('done');
                
                li.innerHTML = `
                    <button class="icon-btn ${task.done ? 'check' : ''}" onclick="toggleTask(${task.id})">
                        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                    </button>
                    <span class="task-text">${task.text}</span>
                    <button class="icon-btn" onclick="deleteTask(${task.id})">
                        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                    </button>
                `;
                list.appendChild(li);
            });
        }

        function saveData() { localStorage.setItem('my_path_tasks', JSON.stringify(tasks)); }

        function updateStreak() {
            document.getElementById('streak-display').innerText = `🔥 ${tasks.filter(t => t.done).length}`;
        }

        function selectTag(tag, btn) {
            if (selectedTag === tag) {
                selectedTag = null;
                btn.classList.remove('active');
            } else {
                selectedTag = tag;
                document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            }
        }

        function openAddPanel() {
            document.getElementById('addPanelOverlay').classList.add('active');
            setTimeout(() => document.getElementById('panelTaskInput').focus(), 300);
        }

        function closeAddPanel(e) {
            if (e && e.target && !e.target.classList.contains('add-panel-overlay')) return;
            document.getElementById('addPanelOverlay').classList.remove('active');
            document.getElementById('panelTaskInput').value = '';
        }

        // ЧАТ
        function handleChatKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const chatMessages = document.getElementById('chatMessages');
            const userBubble = document.createElement('div');
            userBubble.className = 'msg-bubble msg-user';
            userBubble.innerText = text;
            chatMessages.appendChild(userBubble);

            input.value = '';
            scrollToBottom();

            const aiBubble = document.createElement('div');
            aiBubble.className = 'msg-bubble msg-ai';
            aiBubble.innerText = "Думаю...";
            chatMessages.appendChild(aiBubble);
            scrollToBottom();

            let history = JSON.parse(localStorage.getItem('my_ai_history')) || [];
            history.push({ role: "user", text: text });
            if (history.length > 20) history.shift();

            let fullPrompt = "Ты — суровый, но справедливый психолог. Пиши коротко, 2-3 предложения. Без списков.\n\n";
            history.forEach(msg => { fullPrompt += (msg.role === "user" ? "Пользователь: " : "ИИ: ") + msg.text + "\n"; });
            fullPrompt += "Ответь коротко:";

            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
                const aiAnswer = await response.text();

                if (response.status === 404 || aiAnswer.includes('404') || aiAnswer.includes('Not Found')) {
                    aiBubble.innerText = "Лимит на сегодня исчерпан, брат. Отдыхай, копи силы до завтра 💪";
                } else {
                    aiBubble.innerText = aiAnswer;
                    history.push({ role: "assistant", text: aiAnswer });
                    if (history.length > 20) history.shift();
                    localStorage.setItem('my_ai_history', JSON.stringify(history));
                }
            } catch (error) {
                aiBubble.innerText = "Лимит на сегодня исчерпан, брат. Отдыхай, копи силы до завтра 💪";
            }
            scrollToBottom();
        }
        // --- КАЛЕНДАРЬ ---
        function renderCalendar() {
            const container = document.getElementById('calendarMonths');
            if (!container) return;
            container.style.minHeight = "400px";
            container.innerHTML = '';

            const today = new Date();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();
            const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
            
            const monthBlock = document.createElement('div');
            monthBlock.className = 'month-block';
            
            const title = document.createElement('div');
            title.className = 'month-title';
            title.innerText = `${monthNames[currentMonth]} ${currentYear}`;
            title.style.cssText = "text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 15px; color: var(--text);";
            monthBlock.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'calendar-grid';
            grid.style.cssText = "display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center;";

            const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            daysOfWeek.forEach(day => {
                const d = document.createElement('div');
                d.innerText = day;
                d.style.cssText = "font-size: 11px; color: var(--hint); padding-bottom: 5px;";
                grid.appendChild(d);
            });

            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            
            for (let i = 1; i < (firstDay === 0 ? 7 : firstDay); i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let i = 1; i <= daysInMonth; i++) {
                const dayDiv = document.createElement('div');
                dayDiv.className = 'cal-day';
                dayDiv.innerText = i;
                dayDiv.style.cssText = "padding: 10px 0; background: var(--card); border-radius: 5px; font-size: 14px; cursor: pointer;";
                                const today = new Date();
                today.setHours(0,0,0,0);
                const thisDate = new Date(currentYear, currentMonth, i);
                if (thisDate < today) {
                    dayDiv.classList.add('past');
                }

                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                dayDiv.onclick = () => {
                    alert(`Выбран день: ${i} ${monthNames[currentMonth]}`);
                };
                grid.appendChild(dayDiv);
            }
            monthBlock.appendChild(grid);
            container.appendChild(monthBlock);
        }

        // --- ЗАЛ СЛАВЫ ---
        function renderHall() {
            const doneList = document.getElementById('hallDoneList');
            const failList = document.getElementById('hallFailList');
            if (!doneList || !failList) return;
            
            doneList.innerHTML = '';
            failList.innerHTML = '';

            const monthAgo = new Date();
            monthAgo.setDate(monthAgo.getDate() - 30);
            const monthAgoStr = monthAgo.toISOString().split('T')[0];

            const doneTasks = tasks.filter(t => t.done && t.date >= monthAgoStr);
            const failTasks = tasks.filter(t => !t.done && t.date < new Date().toISOString().split('T')[0]);

            if (doneTasks.length === 0) doneList.innerHTML = '<div style="color:var(--hint); font-size:14px;">Пока нет выполненных задач.</div>';
            else {
                doneTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.style.cssText = "background: var(--card); padding: 10px; border-radius: 8px; margin-bottom: 5px; opacity: 0.7;";
                    li.innerHTML = `<span style="text-decoration: line-through; color: var(--hint);">${task.text}</span>`;
                    doneList.appendChild(li);
                });
            }

            if (failTasks.length === 0) failList.innerHTML = '<div style="color:var(--green); font-size:14px;">Идеально. Все задачи закрыты.</div>';
            else {
                failTasks.forEach(task => {
                    const li = document.createElement('li');
                    li.style.cssText = "background: var(--card); padding: 10px; border-radius: 8px; margin-bottom: 5px; border-left: 3px solid var(--red);";
                    li.innerHTML = `<span style="color: var(--text);">${task.text}</span>`;
                    failList.appendChild(li);
                });
            }
        }
        init();
    </script>
</body>
</html>
