<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой путь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --accent: #e53935;
            --green: #4caf50;
            --gold: #ffb300;
            --gray: #777;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
       body {
    background-color: #09090b; /* Глубокий черный */
    margin: 0;
    padding: 0;
    color: white;
    overflow-x: hidden;
    position: relative;
    font-family: system-ui, -apple-system, sans-serif;
}

.bg-animations {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: -1; pointer-events: none; overflow: hidden;
}

/* Ломаные неоновые линии */
.line {
    position: absolute;
    background: linear-gradient(90deg, transparent, #39FF14, transparent);
    opacity: 0.15;
    height: 1px;
    width: 150%;
    left: -25%;
    box-shadow: 0 0 10px #39FF14;
}

.line-1 { top: 20%; transform: rotate(-15deg); animation: move1 10s infinite linear; }
.line-2 { top: 60%; transform: rotate(25deg); animation: move2 15s infinite linear; }
.line-3 { top: 80%; transform: rotate(-35deg); animation: move3 12s infinite linear; opacity: 0.1; }

@keyframes move1 {
    0% { transform: translateX(-10%) rotate(-15deg); }
    50% { transform: translateX(10%) rotate(-15deg); }
    100% { transform: translateX(-10%) rotate(-15deg); }
}
@keyframes move2 {
    0% { transform: translateX(10%) rotate(25deg); }
    50% { transform: translateX(-10%) rotate(25deg); }
    100% { transform: translateX(10%) rotate(25deg); }
}
@keyframes move3 {
    0% { transform: translateY(0) rotate(-35deg); }
    50% { transform: translateY(-20px) rotate(-35deg); }
    100% { transform: translateY(0) rotate(-35deg); }
}

        /* ЭКРАН ПРИВЕТСТВИЯ */
        #splash {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000; display: none;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 25px; z-index: 1000;
        }
        #splash h2 { font-size: 28px; margin-bottom: 15px; color: var(--accent); text-transform: uppercase; }
        #splash .main-desc { font-size: 16px; color: #ccc; margin-bottom: 25px; line-height: 1.4; }
        #splash .phrase { font-size: 15px; color: var(--gold); font-style: italic; margin-bottom: 40px; padding: 0 10px; }
        #splash button {
            background-color: var(--accent); color: white; border: none;
            padding: 15px 40px; font-size: 18px; font-weight: bold; border-radius: 12px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(229, 57, 53, 0.3); transition: transform 0.1s;
        }
        #splash button:active { transform: scale(0.95); }

        /* ШАПКА */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        #streak-display { font-size: 14px; font-weight: bold; color: var(--gold); background: #2a2a2a; padding: 6px 12px; border-radius: 20px; }
        
        /* ПРОГРЕСС БАРЫ */
        .progress-container { display: flex; gap: 8px; margin-bottom: 15px; }
        .prog-wrapper { flex: 1; background: var(--card); border-radius: 4px; overflow: hidden; position: relative; height: 8px; }
        .prog-bar { height: 100%; width: 0%; background: var(--green); transition: width 0.3s; }
        .prog-labels { display: flex; gap: 8px; margin-top: 4px; font-size: 10px; color: var(--gray); text-align: center; }
        .prog-labels div { flex: 1; }

        /* ВКЛАДКИ */
   .tabs { 
    display: flex; gap: 8px; margin-bottom: 20px; 
    overflow-x: auto; padding-bottom: 5px; align-items: stretch; height: 45px; 
    -ms-overflow-style: none;  /* Скрыть скроллбар в IE и Edge */
    scrollbar-width: none;  /* Скрыть скроллбар в Firefox */
}
.tabs::-webkit-scrollbar { display: none; } /* Скрыть скроллбар в Chrome/Safari */
.tabs button {
    flex: 1; background: rgba(255, 255, 255, 0.05); color: rgba(255, 255, 255, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 0; border-radius: 20px;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; white-space: nowrap; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; height: 100%;
}
.tabs button.active { 
    background: #39FF14; color: #000; border-color: #39FF14; 
    box-shadow: 0 0 15px rgba(57, 255, 20, 0.4); 
    transform: scale(1.02);
}
        /* КОНТЕНТ */
        #content { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; }
        
        /* ВВОД И ТЕГИ */
        .input-area { display: flex; gap: 8px; margin-bottom: 10px; }
        input[type="text"] {
            flex-grow: 1; padding: 14px; background-color: var(--card);
            border: 1px solid #333; border-radius: 10px; color: white; font-size: 15px; outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        button.add-btn {
            padding: 0 20px; background-color: var(--accent); color: white;
            border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: transform 0.1s;
        }
        button.add-btn:active { transform: scale(0.95); }
        
        .tags-container { display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap; align-items: center; min-height: 30px; }
        .tag-btn {
            background: transparent; border: 1px solid #555; color: #aaa;
            padding: 6px 12px; border-radius: 15px; font-size: 12px; cursor: pointer; transition: 0.2s;
        }
        .tag-btn:active { background: #333; }
        .tag-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        /* СПИСКИ ЗАДАЧ */
        ul { list-style: none; }
        li {
            background-color: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(5px);
            padding: 15px; margin-bottom: 10px;
            border-radius: 12px; border-left: 4px solid var(--accent);
            display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s;
        }
        li:active { background-color: #2a2a2a; }
        li.done { border-left-color: var(--green); opacity: 0.5; }
        li.failed { border-left-color: var(--gray); }
        li.main-goal { border: 1px solid var(--gold); border-left: 6px solid var(--gold); }
        
        .task-row { display: flex; align-items: center; gap: 12px; }
        .icon-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 5px; }
        .icon-btn svg { width: 22px; height: 22px; fill: var(--gray); transition: fill 0.2s; }
        .icon-btn:active svg { fill: var(--text); }
        .icon-btn.check svg { fill: var(--green); }
        .icon-btn.main-btn svg { fill: var(--gold); }
        .task-text { flex-grow: 1; font-size: 16px; word-break: break-word; }
        li.done .task-text { text-decoration: line-through; }

        /* ЧАТ МОТИВАТОР */
        #chatView { display: none; flex-direction: column; height: 100%; }
        .chat-messages { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 10px;}
        .msg-bubble { padding: 12px; border-radius: 12px; max-width: 80%; font-size: 15px; line-height: 1.4; }
        .msg-user { background-color: var(--accent); color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-ai { background-color: var(--card); color: var(--text); align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #333; }
        .chat-input-area { display: flex; gap: 8px; margin-top: auto; padding-top: 10px; }

        /* КАЛЕНДАРЬ */
        #calendarView { display: none; flex-direction: column; }
        .month-block { margin-bottom: 25px; }
        .month-title { text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 12px; color: var(--accent); text-transform: capitalize; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
        .day-name { font-size: 11px; color: var(--gray); padding-bottom: 5px; }
        
        .cal-day {
            padding: 10px 0; background-color: var(--card); border-radius: 8px;
            font-size: 14px; cursor: pointer; position: relative; border: 1px solid transparent;
        }
        .cal-day:active { background: #333; }
        .cal-day.today { border-color: var(--accent); font-weight: bold; color: var(--accent); }
        .cal-day.past { opacity: 0.3; pointer-events: none; background: transparent; }
        
        .dots-container { position: absolute; bottom: 4px; width: 100%; display: flex; justify-content: center; gap: 3px; }
        .dot { width: 4px; height: 4px; background-color: var(--gold); border-radius: 50%; }

        /* СТРАНИЦА ДНЯ */
        #dayView { display: none; flex-direction: column; height: 100%; }
        .day-view-header { display: flex; align-items: center; margin-bottom: 15px; gap: 15px;}
        .back-btn { background: none; border: none; color: var(--text); font-size: 24px; cursor: pointer; }
        #dayViewTitle { font-size: 18px; font-weight: bold; color: var(--accent); }

        /* ЗАЛ СЛАВЫ */
        .hall-section { margin-bottom: 20px; }
        .hall-title { font-size: 16px; margin-bottom: 10px; font-weight: bold; padding-left: 5px; }
        .hall-title.done-title { color: var(--green); }
        .hall-title.fail-title { color: var(--accent); }
        .reschedule-area { display: flex; gap: 10px; margin-top: 5px; align-items: center; }
        .reschedule-area select { background: #333; color: white; border: none; padding: 8px; border-radius: 6px; flex-grow: 1; font-size: 14px;}
        .reschedule-area button { background: var(--accent); color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold;}

        /* ВЫБРАННЫЙ ТЕГ (ПЛАШКА) */
        #selectedTagDisplay {
            display: none; align-items: center; gap: 5px; background: rgba(76, 175, 80, 0.2);
            border: 1px solid var(--green); color: var(--green); padding: 5px 12px; border-radius: 15px; font-size: 12px;
        }
        #selectedTagDisplay button { background: none; border: none; color: var(--green); font-size: 16px; cursor: pointer; display: flex; align-items: center; }
    </style>
</head>
<body>
<div class="bg-animations">
    <div class="line line-1"></div>
    <div class="line line-2"></div>
    <div class="line line-3"></div>
</div>
    <div id="splash">
        <h2>Мой путь</h2>
        <p class="main-desc">Это твой штаб.<br>Здесь не ноют.<br>Слабые сдаются — мы идем до конца.</p>
        <p class="phrase" id="splashPhrase"></p>
        <button onclick="closeSplash()">ПРИСТУПИТЬ</button>
    </div>

    <div class="header">
        <h1>Мой путь</h1>
        <div id="streak-display">🔥 0</div>
    </div>
    
    <div class="progress-container">
        <div class="prog-wrapper"><div class="prog-bar" id="prog-day"></div></div>
        <div class="prog-wrapper"><div class="prog-bar" id="prog-week"></div></div>
        <div class="prog-wrapper"><div class="prog-bar" id="prog-month"></div></div>
    </div>
    <div class="prog-labels">
        <div>День</div>
        <div>Неделя</div>
        <div>Месяц</div>
    </div>

    <div class="tabs" style="margin-top: 15px;">
        <button id="tab-today" onclick="switchTab('today')">Сегодня</button>
        <button id="tab-tomorrow" onclick="switchTab('tomorrow')">Завтра</button>
        <button id="tab-calendar" onclick="switchTab('calendar')">Календарь</button>
        <button id="tab-hall" onclick="switchTab('hall')">Зал славы</button>
        <button id="tab-chat" onclick="switchTab('chat')">Мотиватор</button>
    </div>

    <div id="content">
        
        <!-- СПИСКИ -->
        <div id="standardView" style="display: flex; flex-direction: column; height: 100%;">
            <div id="inputBlock">
                <div class="input-area">
                    <input type="text" id="taskInput" placeholder="Что нужно сделать?">
                    <button class="add-btn" onclick="addTask()">В БОЙ</button>
                </div>
                <div class="tags-container">
                    <button class="tag-btn" onclick="selectTag('Спорт')">+ Спорт</button>
                    <button class="tag-btn" onclick="selectTag('Работа')">+ Работа</button>
                    <button class="tag-btn" onclick="selectTag('Блог')">+ Блог</button>
                    <button class="tag-btn" onclick="selectTag('Личное')">+ Личное</button>
                    <div id="selectedTagDisplay">
                        <span id="selectedTagText"></span>
                        <button onclick="clearTag()">✕</button>
                    </div>
                </div>
            </div>
            <ul id="taskList"></ul>
        </div>

        <!-- ЧАТ -->
        <div id="chatView">
            <div class="chat-messages" id="chatMessages">
                <div class="msg-bubble msg-ai">Я твой мотиватор. Выкладывай, что случилось, и мы это разъебем.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chatInput" placeholder="Напиши сообщение..." onkeypress="handleChatKeyPress(event)">
                <button class="add-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>

        <!-- КАЛЕНДАРЬ -->
        <div id="calendarView">
            <div id="calendarMonths"></div>
        </div>

        <!-- СТРАНИЦА ДНЯ -->
        <div id="dayView">
            <div class="day-view-header">
                <button class="back-btn" onclick="closeDayView()">←</button>
                <div id="dayViewTitle">Дата</div>
            </div>
            <div class="input-area">
                <input type="text" id="dayInput" placeholder="Задача на этот день...">
                <button class="add-btn" onclick="addTaskDayView()">В БОЙ</button>
            </div>
            <ul id="dayTaskList"></ul>
        </div>

        <!-- ЗАЛ СЛАВЫ -->
        <div id="hallView" style="display: none; flex-direction: column; height: 100%;">
            <div class="hall-section">
                <div class="hall-title done-title">✅ Выполнено</div>
                <ul id="hallDoneList"></ul>
            </div>
            <div class="hall-section">
                <div class="hall-title fail-title">❌ Не выполнено</div>
                <ul id="hallFailList"></ul>
            </div>
        </div>

    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#121212'); }

        let tasks = JSON.parse(localStorage.getItem('my_path_tasks')) || [];
        let currentTab = 'today';
        let activeDayDate = null;
        let selectedTag = null;

        const weeklyPhrases = [
            "Новая неделя. Не проеби шанс начать всё заново. Действуй.",
            "Дисциплина сильнее мотивации. Просто открой список и сделай первый шаг.",
            "Экватор недели. Ты уже проделал путь. Не сбавляй обороты.",
            "Тот, кто действует сегодня, завтра пожинает плоды. Не откладывай.",
            "Не расслабляйся раньше времени. Финиш еще не пройден.",
            "Сделай сегодня то, что откладывал всю неделю. Освободи голову.",
            "Оглянись назад. Что ты сделал за эту неделю? Подведи итоги и подготовься к новой."
        ];

        function getTodayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function getTomorrowStr() {
            const d = new Date(); d.setDate(d.getDate() + 1);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        function getDaysAgoStr(days) {
            const d = new Date(); d.setDate(d.getDate() - days);
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        function init() {
            processDayChange();
            checkSplash();
            updateStreakDisplay();
            switchTab('today');
        }

        function processDayChange() {
            const today = getTodayStr();
            const lastDate = localStorage.getItem('last_process_date');
            
            if (lastDate !== today) {
                let hasFailedYesterday = false;
                tasks = tasks.filter(t => {
                    if (t.done && t.date < today) return false; 
                    if (!t.done && t.date < today && t.status !== 'failed') {
                        t.status = 'failed';
                        hasFailedYesterday = true;
                    }
                    return true;
                });

                const monthAgoStr = getDaysAgoStr(30);
                tasks = tasks.filter(t => t.date >= monthAgoStr);

                let currentStreak = parseInt(localStorage.getItem('my_streak')) || 0;
                if (hasFailedYesterday) {
                    currentStreak = 0;
                } else if (lastDate !== null) {
                    currentStreak++; 
                } else {
                    currentStreak = 1;
                }

                localStorage.setItem('my_streak', currentStreak);
                localStorage.setItem('last_process_date', today);
                saveData();
            }
        }

        function updateStreakDisplay() {
            let s = parseInt(localStorage.getItem('my_streak')) || 0;
            document.getElementById('streak-display').innerText = `🔥 ${s}`;
        }

        function checkSplash() {
            const today = getTodayStr();
            if (localStorage.getItem('last_visit') !== today) {
                let dayOfWeek = new Date().getDay();
                let index = dayOfWeek === 0 ? 6 : dayOfWeek - 1; 
                document.getElementById('splashPhrase').innerText = `"${weeklyPhrases[index]}"`;
                document.getElementById('splash').style.display = 'flex';
            }
        }
        function closeSplash() {
            localStorage.setItem('last_visit', getTodayStr());
            document.getElementById('splash').style.display = 'none';
        }

        function selectTag(tag) {
            selectedTag = tag;
            document.getElementById('selectedTagText').innerText = tag;
            document.getElementById('selectedTagDisplay').style.display = 'flex';
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.disabled = true;
                btn.style.opacity = '0.3';
            });
        }

        function clearTag() {
            selectedTag = null;
            document.getElementById('selectedTagDisplay').style.display = 'none';
            document.querySelectorAll('.tag-btn').forEach(btn => {
                btn.disabled = false;
                btn.style.opacity = '1';
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            
            document.getElementById('standardView').style.display = 'none';
            document.getElementById('calendarView').style.display = 'none';
            document.getElementById('dayView').style.display = 'none';
            document.getElementById('hallView').style.display = 'none';
            document.getElementById('chatView').style.display = 'none';

            if (tab === 'calendar') {
                document.getElementById('calendarView').style.display = 'flex';
                renderCalendar();
            } else if (tab === 'hall') {
                document.getElementById('hallView').style.display = 'flex';
                renderHall();
            } else if (tab === 'chat') {
                document.getElementById('chatView').style.display = 'flex';
                scrollToBottom();
            } else {
                document.getElementById('standardView').style.display = 'flex';
                document.getElementById('inputBlock').style.display = 'block';
                renderTasks();
            }
            clearTag(); 
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            let text = input.value.trim();
            if (!text && !selectedTag) return;

            let finalText = selectedTag ? `[${selectedTag}] ${text}` : text;
            let taskDate = getTodayStr();
            if (currentTab === 'tomorrow') taskDate = getTomorrowStr();

            tasks.push({ id: Date.now(), text: finalText, date: taskDate, done: false, status: 'active', isMainGoal: false });
            input.value = '';
            clearTag();
            saveData();
            renderTasks();
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.done = !task.done;
                if(task.done) task.isMainGoal = false; 
                saveData();
                renderTasks();
                renderHall();
                if (tg) tg.HapticFeedback.notificationOccurred('success');
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveData();
            renderTasks();
            renderHall();
        }

        function setMainGoal(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                tasks.forEach(t => { if(t.date === task.date) t.isMainGoal = false; });
                task.isMainGoal = !task.isMainGoal; 
                saveData();
                renderTasks();
                if (tg) tg.HapticFeedback.impactOccurred('medium');
            }
        }

        function rescheduleTask(id) {
            const select = document.getElementById(`resched-${id}`);
            const newDate = select.value;
            if (!newDate) return;

            const task = tasks.find(t => t.id === id);
            if (task) {
                task.date = newDate;
                task.status = 'active';
                task.done = false;
            }
            saveData();
            renderHall();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const today = getTodayStr();
            list.innerHTML = '';

            let filtered = tasks.filter(t => {
                if (currentTab === 'today') return t.date === today && t.status !== 'failed';
                if (currentTab === 'tomorrow') return t.date === getTomorrowStr() && t.status !== 'failed';
                return false;
            });

            filtered.sort((a, b) => (b.isMainGoal === true ? 1 : 0) - (a.isMainGoal === true ? 1 : 0));
            updateProgressBars();

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#777; margin-top:30px; font-size:14px;">Здесь пусто. Добавь задачу.</div>';
                return;
            }

            filtered.forEach(task => {
                const li = document.createElement('li');
                let classes = '';
                if (task.done) classes += 'done ';
                if (task.isMainGoal && !task.done) classes += 'main-goal ';
                li.className = classes;

                const checkIcon = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
                const circleIcon = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>`;
                const starIcon = `<svg viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>`;
                const starEmptyIcon = `<svg viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></svg>`;
                const delIcon = `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

                li.innerHTML = `
                    <div class="task-row">
                        <button class="icon-btn ${task.done ? 'check' : ''}" onclick="toggleTask(${task.id})">
                            ${task.done ? checkIcon : circleIcon}
                        </button>
                        <span class="task-text">${task.text}</span>
                        <div style="display:flex;">
                            ${!task.done ? `<button class="icon-btn main-btn" onclick="setMainGoal(${task.id})">${task.isMainGoal ? starIcon : starEmptyIcon}</button>` : ''}
                            <button class="icon-btn" onclick="deleteTask(${task.id})">${delIcon}</button>
                        </div>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function updateProgressBars() {
            const today = getTodayStr();
            const weekAgo = getDaysAgoStr(7);
            const monthAgo = getDaysAgoStr(30);

            function calcProgress(filterFn) {
                let relevantTasks = tasks.filter(filterFn);
                if (relevantTasks.length === 0) return 0;
                let done = relevantTasks.filter(t => t.done).length;
                return Math.round((done / relevantTasks.length) * 100);
            }

            let dayPct = calcProgress(t => t.date === today && t.status !== 'failed');
            let weekPct = calcProgress(t => t.date >= weekAgo && t.date <= today);
            let monthPct = calcProgress(t => t.date >= monthAgo && t.date <= today);

            document.getElementById('prog-day').style.width = dayPct + '%';
            document.getElementById('prog-week').style.width = weekPct + '%';
            document.getElementById('prog-month').style.width = monthPct + '%';
        }

        function renderHall() {
            const doneList = document.getElementById('hallDoneList');
            const failList = document.getElementById('hallFailList');
            const today = getTodayStr();
            const monthAgo = getDaysAgoStr(30);

            doneList.innerHTML = '';
            failList.innerHTML = '';

            let doneTasks = tasks.filter(t => t.done && t.date >= monthAgo);
            let failTasks = tasks.filter(t => t.status === 'failed' && t.date >= monthAgo);

            doneTasks.sort((a, b) => b.date.localeCompare(a.date));
            failTasks.sort((a, b) => b.date.localeCompare(a.date));

            if (doneTasks.length === 0) doneList.innerHTML = '<div style="color:#777; font-size:14px; padding:10px;">Пока нет выполненных задач за месяц.</div>';
            if (failTasks.length === 0) failList.innerHTML = '<div style="color:#777; font-size:14px; padding:10px;">Идеально. Все задачи закрыты</div>';

            doneTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'done';
                li.innerHTML = `<div class="task-row"><span class="task-text">${task.text}</span><span style="font-size:12px; color:#777;">${task.date}</span></div>`;
                doneList.appendChild(li);
            });

            failTasks.forEach(task => {
                const li = document.createElement('li');
                li.className = 'failed';
                const delIcon = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;fill:#777;"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

                li.innerHTML = `
                    <div class="task-row">
                        <span class="task-text" style="color:#aaa;">${task.text}</span>
                        <button class="icon-btn" onclick="deleteTask(${task.id})">${delIcon}</button>
                    </div>
                    <div style="font-size:12px; color:var(--accent); margin-left:2px;">Не выполнено: ${task.date}</div>
                    <div class="reschedule-area">
                        <select id="resched-${task.id}">
                            <option value="${today}">На сегодня</option>
                            <option value="${getTomorrowStr()}">На завтра</option>
                        </select>
                        <button onclick="rescheduleTask(${task.id})">Перенести</button>
                    </div>
                `;
                failList.appendChild(li);
            });
        }

        function renderCalendar() {
            const container = document.getElementById('calendarMonths');
            container.innerHTML = '';
            const today = getTodayStr();
            
            const months = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
            const daysOfWeek = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

            const now = new Date();
            
            for (let i = 0; i < 3; i++) {
                const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
                const month = d.getMonth();
                const year = d.getFullYear();
                
                const monthBlock = document.createElement('div');
                monthBlock.className = 'month-block';
                
                let html = `<div class="month-title">${months[month]} ${year}</div>`;
                html += `<div class="calendar-grid">`;
                daysOfWeek.forEach(day => html += `<div class="day-name">${day}</div>`);

                let firstDay = d.getDay();
                if (firstDay === 0) firstDay = 7; 
                for (let j = 1; j < firstDay; j++) {
                    html += `<div class="cal-day past"></div>`;
                }

                const totalDays = new Date(year, month + 1, 0).getDate();
                for (let day = 1; day <= totalDays; day++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                    let tasksOnDay = tasks.filter(t => t.date === dateStr && t.status !== 'failed');
                    let dotsHTML = '';
                    if (tasksOnDay.length > 0) {
                        dotsHTML = '<div class="dots-container">';
                        for(let k=0; k < Math.min(tasksOnDay.length, 4); k++) dotsHTML += '<div class="dot"></div>';
                        dotsHTML += '</div>';
                    }
                    let classNames = 'cal-day';
                    if (dateStr === today) classNames += ' today';
                    if (dateStr < today) classNames += ' past';
                    html += `<div class="${classNames}" onclick="openDayView('${dateStr}')">${day}${dotsHTML}</div>`;
                }
                html += `</div>`;
                monthBlock.innerHTML = html;
                container.appendChild(monthBlock);
            }
        }

        function openDayView(dateStr) {
            if(dateStr < getTodayStr()) return;
            activeDayDate = dateStr;
            document.getElementById('calendarView').style.display = 'none';
            document.getElementById('dayView').style.display = 'flex';
            const parts = dateStr.split('-');
            const d = new Date(parts[0], parts[1]-1, parts[2]);
            const months = ['Января', 'Февраля', 'Марта', 'Апреля', 'Мая', 'Июня', 'Июля', 'Августа', 'Сентября', 'Октября', 'Ноября', 'Декабря'];
            document.getElementById('dayViewTitle').innerText = `${d.getDate()} ${months[d.getMonth()]}`;
            renderDayViewTasks();
        }

        function closeDayView() {
            activeDayDate = null;
            document.getElementById('dayView').style.display = 'none';
            document.getElementById('calendarView').style.display = 'flex';
            renderCalendar(); 
        }

        function renderDayViewTasks() {
            const list = document.getElementById('dayTaskList');
            list.innerHTML = '';
            const filtered = tasks.filter(t => t.date === activeDayDate && t.status !== 'failed');
            filtered.sort((a, b) => (b.isMainGoal === true ? 1 : 0) - (a.isMainGoal === true ? 1 : 0));

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#777; margin-top:20px;">На этот день пусто.</div>';
                return;
            }

            filtered.forEach(task => {
                const li = document.createElement('li');
                let classes = '';
                if (task.done) classes += 'done ';
                if (task.isMainGoal && !task.done) classes += 'main-goal ';
                li.className = classes;

                const checkIcon = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
                const circleIcon = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>`;
                const delIcon = `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;

                li.innerHTML = `
                    <div class="task-row">
                        <button class="icon-btn ${task.done ? 'check' : ''}" onclick="toggleTaskFromDay(${task.id})">
                            ${task.done ? checkIcon : circleIcon}
                        </button>
                        <span class="task-text">${task.text}</span>
                        <button class="icon-btn" onclick="deleteTaskFromDay(${task.id})">${delIcon}</button>
                    </div>
                `;
                list.appendChild(li);
            });
        }

        function addTaskDayView() {
            const input = document.getElementById('dayInput');
            const text = input.value.trim();
            if (!text) return;
            tasks.push({ id: Date.now(), text: text, date: activeDayDate, done: false, status: 'active', isMainGoal: false });
            input.value = '';
            saveData();
            renderDayViewTasks();
            if (tg) tg.HapticFeedback.impactOccurred('light');
        }

        function toggleTaskFromDay(id) { toggleTask(id); renderDayViewTasks(); }
        function deleteTaskFromDay(id) { deleteTask(id); renderDayViewTasks(); }

        // --- ЧАТ С ИИ ---
          async function sendMessage() {
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if (!text) return;

    const chatMessages = document.getElementById('chatMessages');
    
    // Добавляем сообщение пользователя на экран
    const userBubble = document.createElement('div');
    userBubble.className = 'msg-bubble msg-user';
    userBubble.innerText = text;
    chatMessages.appendChild(userBubble);

    input.value = '';
    scrollToBottom();

    // Добавляем "ИИ печатает..."
    const aiBubble = document.createElement('div');
    aiBubble.className = 'msg-bubble msg-ai';
    aiBubble.innerText = "Думаю...";
    chatMessages.appendChild(aiBubble);
    scrollToBottom();

    // Получаем историю из памяти телефона
    let history = JSON.parse(localStorage.getItem('my_ai_history')) || [];
    history.push({ role: "user", text: text });
    if (history.length > 5) history.shift(); // Держим только 5 последних

    // Формируем промпт для ИИ
    let fullPrompt = "Ты — суровый, но справедливый психолог и мотиватор. Твоя задача — поддержать пользователя, который чувствует пустоту или усталость. Говори коротко, по-мужски, без воды. Можно с юмором. Пиши максимум 2-3 предложения. НЕ пиши списки, НЕ используй markdown. НЕ пиши код, НЕ решай математику, НЕ отвечай на вопросы не по теме. Обращайся на 'ты', без имен.\n\nИстория диалога:\n"
    history.forEach(msg => {
        fullPrompt += (msg.role === "user" ? "Пользователь: " : "ИИ: ") + msg.text + "\n";
    });
   

    try {
        // Отправляем запрос напрямую в бесплатный ИИ
        const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}`);
        const aiAnswer = await response.text();

        // Показываем ответ в приложении
        aiBubble.innerText = aiAnswer;

        // Сохраняем ответ ИИ в память
        history.push({ role: "assistant", text: aiAnswer });
        if (history.length > 5) history.shift();
        localStorage.setItem('my_ai_history', JSON.stringify(history));

    } catch (error) {
        aiBubble.innerText = "Связь с мозгом потеряна. Попробуй позже.";
        console.error(error);
    }
    scrollToBottom();
}
function handleChatKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
        }

        function scrollToBottom() {
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function saveData() {
            localStorage.setItem('my_path_tasks', JSON.stringify(tasks));
        }
function loadChatHistory() {
    const chatMessages = document.getElementById('chatMessages');
    if (!chatMessages) return;
    
    chatMessages.innerHTML = '';

    let history = JSON.parse(localStorage.getItem('my_ai_history')) || [];

    if (history.length === 0) {
        const welcome = document.createElement('div');
        welcome.className = 'msg-bubble msg-ai';
        welcome.innerText = "Я твой мотиватор. Выкладывай, что случилось, и мы это разъебем.";
        chatMessages.appendChild(welcome);
        return;
    }

    history.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = msg.role === 'user' ? 'msg-bubble msg-user' : 'msg-bubble msg-ai';
        bubble.innerText = msg.text;
        chatMessages.appendChild(bubble);
    });

    scrollToBottom();
}

// Вызываем загрузку истории при старте
loadChatHistory();
        init();
    </script>
